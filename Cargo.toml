# Vocdoni Passport Prover - Rust Workspace
#
# This workspace contains the core proving logic for the Vocdoni Passport system.
#
# Copyright (c) 2024 Vocdoni Association
# SPDX-License-Identifier: AGPL-3.0-or-later

[workspace]
members = [
  "crates/acvm-witness-jni",
  "crates/prover-cli",
  "crates/prover-core",
  "crates/prover-types",
]
resolver = "2"

# NOTE: tried fat LTO + codegen-units=1 to speed the on-device witness solver,
# but device testing showed ~no measurable gain (RSA-4096 witness ~2749ms vs
# ~2795ms) while roughly doubling the Docker build (full LTO recompile of all
# noir/acvm deps x2 targets). Reverted to the default release profile. The
# witness bottleneck is the Brillig interpreter + gzip round-trip, not cross-
# crate inlining; revisit only with a profiler-guided change.

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["Vocdoni Association <info@vocdoni.io>"]
repository = "https://github.com/vocdoni/vocdoni-passport-prover"
homepage = "https://github.com/vocdoni/vocdoni-passport-prover"
description = "Zero-knowledge proof generation for Vocdoni Passport"
keywords = ["zkpassport", "zero-knowledge", "privacy", "identity", "vocdoni"]
categories = ["cryptography", "authentication"]

[workspace.dependencies]
# Error handling
anyhow = "1"
thiserror = "2"

# Noir/ACVM dependencies (pinned to zkPassport-compatible version)
# zkPassport circuits v0.18.0 are built with noir v1.0.0-beta.20 (commit b4236c19).
acvm = { git = "https://github.com/noir-lang/noir", tag = "v1.0.0-beta.20", package = "acvm", default-features = false, features = ["bn254"] }
acir = { git = "https://github.com/noir-lang/noir", tag = "v1.0.0-beta.20", package = "acir", default-features = false, features = ["bn254"] }
bn254_blackbox_solver = { git = "https://github.com/noir-lang/noir", tag = "v1.0.0-beta.20", package = "bn254_blackbox_solver" }
brillig_vm = { git = "https://github.com/noir-lang/noir", tag = "v1.0.0-beta.20", package = "brillig_vm", default-features = false }
nargo = { git = "https://github.com/noir-lang/noir", tag = "v1.0.0-beta.20", package = "nargo" }
noirc_abi = { git = "https://github.com/noir-lang/noir", tag = "v1.0.0-beta.20", package = "noirc_abi" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Compression
flate2 = "1"

# Networking
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

# Utilities
isocountry = "0.3"
tempfile = "3"
x509-parser = "0.18"

# JNI (for mobile FFI)
jni = "0.21"
